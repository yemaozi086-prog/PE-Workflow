[project]
name = "pe-workflow"
version = "0.1.0"
description = "Local, contract-driven power electronics workflow workbench"
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
